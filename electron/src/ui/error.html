<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'self'; script-src 'self'">
  <title>ViLoCare could not start</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="error">
  <div class="card">
    <img class="logo" src="../../assets/logo.png" alt="ViLoCare">
    <h1 class="error">ViLoCare could not start</h1>
    <p id="message"></p>
    <pre id="detail" hidden></pre>
    <button id="retry">Try again</button>
    <button class="secondary" id="logs">Open logs folder</button>
    <button class="secondary" id="quit">Quit</button>
  </div>
  <script src="page.js"></script>
</body>
</html>
