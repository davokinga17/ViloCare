<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'self'; script-src 'self'">
  <title>ViLoCare setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="setup">
  <form class="card" id="form">
    <img class="logo" src="../../assets/logo.png" alt="ViLoCare">
    <h1>Connect to the central server</h1>
    <p>Enter the sync details supplied by your ViLoCare administrator. They are saved on this computer only.</p>
    <p>You can skip this step: ViLoCare will then run offline, and an administrator can add the connection later under Sync Connection.</p>
    <label for="url">Central sync URL</label>
    <input id="url" type="url" placeholder="https://example.com/api/v1/sync" required>
    <label for="token">Sync token</label>
    <input id="token" type="password" autocomplete="off" required>
    <p id="msg" class="error"></p>
    <button type="submit">Save and continue</button>
    <button type="button" class="secondary" id="skip">Skip for now</button>
  </form>
  <script src="page.js"></script>
</body>
</html>
